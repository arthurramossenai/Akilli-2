<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akilli – Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <a href="landingpage.html"><img src="../img/akilli.svg" alt="Logo Akilli"></a>
      </div>

      <nav class="menu" aria-label="Navegação principal">
        <a href="tarefas.html" class="menu-link">Tarefas</a>
        <a href="foco.html" class="menu-link">Foco</a>
        <a href="apps.html" class="menu-link">Distrações</a>
        <a href="ranking.html" class="menu-link">Ranking</a>
      </nav>

      <div class="actions">
        <button class="btn btn-outline">Entrar</button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="content container">
    <section class="tasks">
      <div class="tasks-text">
        <h1>Tarefas</h1>
        <p>
          Defina suas metas e tarefas importantes. O app usa essas
          informações para lembrar você do que realmente importa quando
          surgir uma distração.
        </p>

        <button class="btn btn-primary">Nova Tarefa</button>
      </div>

      <div class="tasks-board" role="region" aria-label="Quadro de tarefas">
        <span class="board-empty">Nenhuma Tarefa Registrada</span>
      </div>
    </section>
  </main>
</body>
</html>
