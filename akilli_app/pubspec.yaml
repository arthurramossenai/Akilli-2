name: akili_app
description: "A new Flutter project adapted from Akili web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.2
  google_fonts: ^8.0.2
  supabase_flutter: ^2.12.2
  usage_stats: ^1.3.1
  installed_apps: ^2.1.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_size: 21
